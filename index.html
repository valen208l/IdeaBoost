<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ff">
<title>IdeaBoost | Generador de ideas</title>
<style>
:root{color-scheme:light;--bg:#f6f3ff;--g1:#ffe3d6;--g2:#d6e6ff;--g3:#e3d9ff;--pn:#fff;--soft:#f2eef9;--ink:#20243a;--mu:#5f5a75;--pr:#6b4fd8;--prd:#5a3fc4;--on:#fff;--bd:#e0d9f5;--chip:#f4effb;--chip-h:#ebe2fa;--br:#8a35d6;--me:#6b4fd8;--er-bg:#fff1ef;--er:#8f3a2b;--sh:0 8px 28px rgba(47,35,75,.08)}
[data-theme="dark"]{color-scheme:dark;--bg:#141b2c;--g1:#3b2a3a;--g2:#1f3556;--g3:#2d2a5c;--pn:#1d273b;--soft:#263249;--ink:#f1eff9;--mu:#b3b4c7;--pr:#b39ae9;--prd:#c4aff5;--on:#141b2c;--bd:#354158;--chip:#29344b;--chip-h:#38445f;--br:#f5a08b;--me:#765bb4;--er-bg:#3b2932;--er:#ffb9ad;--sh:0 8px 28px rgba(0,0,0,.25)}
[data-contrast="high"]{--bg:#fff;--pn:#fff;--soft:#fff;--chip:#fff;--chip-h:#eee;--ink:#000;--mu:#222;--bd:#000;--pr:#3a1ea8;--prd:#2a1480;--on:#fff;--br:#7a1fc2;--me:#3a1ea8;--er-bg:#fff;--er:#8a1c0c}
[data-theme="dark"][data-contrast="high"]{--bg:#000;--pn:#000;--soft:#000;--chip:#000;--chip-h:#222;--ink:#fff;--mu:#fff;--bd:#fff;--pr:#d6c8ff;--prd:#fff;--on:#000;--br:#ffb59c;--me:#5b3fd0;--er-bg:#000;--er:#ffb9ad}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;line-height:1.55}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(40% 30% at 10% 25%,var(--g2),transparent 70%),radial-gradient(34% 28% at 90% 15%,var(--g1),transparent 70%),radial-gradient(44% 36% at 75% 100%,var(--g3),transparent 70%)}
[data-contrast="high"] .bg{display:none}
header{background:var(--pn);border-bottom:1px solid var(--bd);padding:.8rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:var(--sh);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:.7rem}
.logo-icon{width:2.7rem;height:2.7rem;border-radius:.9rem;background:var(--chip);display:grid;place-items:center;color:var(--pr);border:1px solid var(--bd)}
.logo-icon svg{width:1.7rem;height:1.7rem}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--pr);line-height:1.2}
.logo small{display:block;font-size:.78rem;font-weight:400;color:var(--mu);letter-spacing:0}
.settings{position:relative}
.menu-btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--bd);background:var(--soft);color:var(--ink);border-radius:.8rem;padding:.6rem .9rem;min-height:44px;font:inherit;font-size:.85rem;cursor:pointer}
.menu-btn:hover{background:var(--chip-h)}
.menu-btn svg{width:1.15rem;height:1.15rem}
.menu{position:absolute;right:0;top:3.4rem;width:17rem;background:var(--pn);border:1px solid var(--bd);border-radius:1rem;padding:.9rem;box-shadow:var(--sh);display:none}
.menu.open{display:block}
.grp+.grp{margin-top:.8rem}
.gl{font-size:.8rem;font-weight:700;color:var(--mu);margin-bottom:.35rem}
.seg{display:flex;gap:.35rem;flex-wrap:wrap}
.seg button,.hc{flex:1;min-height:44px;padding:.4rem .6rem;border:1px solid var(--bd);border-radius:.7rem;background:var(--soft);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer}
.hc{width:100%}
.seg button[aria-pressed="true"],.hc[aria-pressed="true"]{background:var(--pr);color:var(--on);font-weight:800;border-color:var(--pr)}
.seg button[aria-pressed="true"]::before,.hc[aria-pressed="true"]::before{content:"✓ "}
#chat{flex:1;overflow-y:auto;padding:1.4rem .9rem}
#box{max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.m{max-width:92%;padding:.95rem 1.1rem;border-radius:1.1rem;line-height:1.55;font-size:.95rem;animation:appear .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.bot{background:var(--pn);border:1px solid var(--bd);align-self:flex-start;box-shadow:var(--sh)}
.me{background:var(--me);color:#fff;align-self:flex-end;border-radius:1.1rem 1.1rem .3rem 1.1rem}
.m p+p{margin-top:.5rem}
.hello{padding:.3rem .2rem .2rem}.hello h2{font-size:1.7rem;font-weight:800;line-height:1.25}.hello p{margin-top:.5rem;max-width:60ch}
.fl{display:block;font-size:.9rem;font-weight:700;margin-bottom:.45rem}
.wx{color:var(--mu)}
.idea{border:1px solid var(--bd);border-radius:.9rem;padding:.9rem;margin-top:.7rem;background:var(--soft)}
.idea h3,.m h3{color:var(--pr);font-size:1rem;margin-bottom:.3rem}
.idea p{color:var(--mu);font-size:.9rem}
ol{margin:.5rem 0 .6rem 1.3rem}
.row,.qr{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.b{font:inherit;font-size:.85rem;padding:.55rem .85rem;min-height:44px;border-radius:.7rem;border:1px solid var(--bd);background:var(--chip);color:var(--pr);cursor:pointer}
.b:hover{background:var(--chip-h);border-color:var(--pr)}
.chip{text-align:left;flex:1 1 11rem;border-radius:.9rem;line-height:1.4}
.bk{font-weight:800;color:var(--br)}
.note{font-size:.78rem;color:var(--mu);margin-top:.8rem}
.err{background:var(--er-bg);border-color:var(--er)}
.err h3{color:var(--er)}
button:focus-visible{outline:3px solid var(--pr);outline-offset:3px}
textarea:focus-visible{outline:none}
.comp{background:var(--pn);border-top:1px solid var(--bd);padding:.9rem 1.1rem calc(.9rem + env(safe-area-inset-bottom,0px))}
.cw{max-width:46rem;margin:0 auto}
.rc{display:flex;gap:.7rem;align-items:flex-end}
textarea{flex:1;resize:none;min-height:3.3rem;max-height:9rem;border:1.5px solid var(--bd);border-radius:.9rem;padding:.8rem;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg)}
textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(107,79,216,.22)}
textarea::placeholder{color:var(--mu);opacity:1}
.go{border:0;border-radius:.9rem;padding:0 1.2rem;min-height:3.3rem;background:var(--pr);color:var(--on);font:inherit;font-size:.9rem;font-weight:800;cursor:pointer;white-space:nowrap}
.go:hover:not(:disabled){background:var(--prd)}
.go:disabled{opacity:.55;cursor:not-allowed}
.hint{display:flex;justify-content:space-between;gap:.6rem;font-size:.78rem;color:var(--mu);margin-top:.5rem}
@media(max-width:560px){.rc{flex-direction:column;align-items:stretch}.logo small{display:none}.m{max-width:98%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header>
<div class="brand">
<div class="logo-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.5 14.5a7 7 0 1 1 7 0c-.8.6-1.2 1.4-1.3 2.5h-4.4c-.1-1.1-.5-1.9-1.3-2.5Z"/><path d="M12 3v2"/><path d="m5.6 5.6 1.4 1.4"/><path d="M18.4 5.6 17 7"/></svg></div>
<h1 class="logo">IdeaBoost<small>Ideas creativas en segundos, a tu medida.</small></h1>
</div>
<div class="settings">
<button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Ajustes</span></button>
<div class="menu" id="menu">
<div class="grp"><p class="gl" id="l1">Tema</p><div class="seg" role="group" aria-labelledby="l1">
<button type="button" data-theme-choice="light">Claro</button><button type="button" data-theme-choice="dark">Oscuro</button><button type="button" data-theme-choice="auto">Automático</button></div></div>
<div class="grp"><p class="gl" id="l2">Tamaño del texto</p><div class="seg" role="group" aria-labelledby="l2">
<button type="button" data-size="100">Normal</button><button type="button" data-size="115">Grande</button><button type="button" data-size="130">Muy grande</button></div></div>
<div class="grp"><button type="button" class="hc" id="hc" aria-pressed="false">Alto contraste</button></div>
</div>
</div>
</header>
<div id="chat"><div id="box" aria-live="polite" aria-relevant="additions"></div></div>
<form id="f" class="comp"><div class="cw">
<label class="fl" for="q">¿Qué idea vamos a crear hoy?</label>
<div class="rc">
<textarea id="q" rows="2" maxlength="300" placeholder="Ej: nombres para una cafetería universitaria, un tema para mi proyecto de clase…"></textarea>
<button id="go" class="go" disabled>Generar ideas</button>
</div>
<div class="hint"><span>Cuéntame para quién y para qué. Con más contexto, las ideas salen mejores.</span><span><b id="n">0</b>/300</span></div>
</div></form>
<script>
const $=id=>document.getElementById(id),box=$("box"),q=$("q"),go=$("go");
let history=[],busy=false;

/* Ajustes e inclusión: tema, tamaño de texto y alto contraste */
let prefs={theme:"auto",size:"100",contrast:"off"};
try{Object.assign(prefs,JSON.parse(localStorage.getItem("ideaBoostPrefs")||"{}"))}catch(_){}
function applyPrefs(){
  const dark=prefs.theme==="dark"||(prefs.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches),r=document.documentElement;
  r.dataset.theme=dark?"dark":"light";
  r.dataset.contrast=prefs.contrast==="on"?"high":"normal";
  r.style.fontSize=prefs.size+"%";
  document.querySelectorAll("[data-theme-choice]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeChoice===prefs.theme));
  document.querySelectorAll("[data-size]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.size===prefs.size));
  $("hc").setAttribute("aria-pressed",prefs.contrast==="on");
  document.querySelector('meta[name="theme-color"]').setAttribute("content",dark?"#141b2c":"#f6f3ff");
}
function setPref(k,v){prefs[k]=v;try{localStorage.setItem("ideaBoostPrefs",JSON.stringify(prefs))}catch(_){}applyPrefs()}
function closeMenu(){$("menu").classList.remove("open");$("menuBtn").setAttribute("aria-expanded","false")}
$("menuBtn").addEventListener("click",()=>$("menuBtn").setAttribute("aria-expanded",$("menu").classList.toggle("open")));
document.querySelectorAll("[data-theme-choice]").forEach(b=>b.addEventListener("click",()=>setPref("theme",b.dataset.themeChoice)));
document.querySelectorAll("[data-size]").forEach(b=>b.addEventListener("click",()=>setPref("size",b.dataset.size)));
$("hc").addEventListener("click",()=>setPref("contrast",prefs.contrast==="on"?"off":"on"));
document.addEventListener("click",e=>{if(!e.target.closest(".settings"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();$("menuBtn").focus()}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(prefs.theme==="auto")applyPrefs()});
applyPrefs();

const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function btn(t,fn,cls){const b=h("button",cls||"b",t);b.type="button";b.onclick=fn;return b}
function sync(){$("n").textContent=q.value.length;go.disabled=busy||!q.value.trim()}
function put(m){box.append(m);m.scrollIntoView({block:"start",behavior:calm?"auto":"smooth"})}
function saveBtn(text){
  const b=btn("Guardar",()=>{
    try{
      const s=JSON.parse(localStorage.getItem("ideaBoost")||"[]");
      s.push({text,date:new Date().toLocaleDateString("es-CO")});
      localStorage.setItem("ideaBoost",JSON.stringify(s));
      b.textContent="Guardada ✓";
    }catch(_){b.textContent="No se pudo guardar"}
  });
  return b;
}

/* Bienvenida amistosa (Tesler) y prompts guiados */
(function(){
  const hr=new Date().getHours(),sal=hr<12?"Buenos días":hr<19?"Buenas tardes":"Buenas noches";
  const m=h("section","hello");
  m.append(
    h("h2","",sal+", ¿cómo estás?"),
    h("p","","No necesitas tenerlo todo claro: cuéntame con tus palabras y yo me encargo del resto."),
    h("p","wx","¿Necesitas ayuda para empezar? Toca una de estas y la completamos juntos:")
  );
  const r=h("div","row");
  ["Dame ideas para un proyecto de [materia] sobre [tema]","Sugiere nombres para un emprendimiento de [sector] dirigido a [público]","Propón ideas de publicaciones sobre [tema] para [red social]"].forEach(t=>{
    const c=h("button","b chip");c.type="button";
    t.split(/(\[[^\]]+\])/).forEach(p=>c.append(p[0]==="["?Object.assign(h("span","bk"),{textContent:p}):document.createTextNode(p)));
    c.onclick=()=>{q.value=t;sync();q.focus();const i=t.indexOf("[");q.setSelectionRange(i,t.indexOf("]",i)+1)};
    r.append(c);
  });
  m.append(r);box.append(m);
})();

function render(d){
  const m=h("div","m bot");
  if(d.kind==="question"&&d.text){m.textContent=d.text}
  else if(d.kind==="ideas"&&Array.isArray(d.ideas)&&d.ideas.length){
    m.append(h("p","","¡Listo! Aquí tienes 3 ideas para empezar. ¿Cuál te llama más? Toca «Desarrollar esta» y armamos el plan juntos."));
    d.ideas.slice(0,3).forEach((i,n)=>{
      const c=h("div","idea"),r=h("div","row");
      r.append(btn("Desarrollar esta",()=>send("Desarrolla la idea «"+i.title+"»")),saveBtn(i.title+": "+i.start));
      c.append(h("h3","",(n+1)+". "+i.title),h("p","",i.start),r);
      m.append(c);
    });
    const r=h("div","qr");
    r.append(btn("Dame más como estas",()=>send("Dame 3 ideas nuevas, distintas a las anteriores, en la misma línea")),
             btn("Cambiar de enfoque",()=>send("No me convencieron. Cambia de enfoque y dame 3 ideas con otro ángulo")));
    m.append(r,h("p","note","Generado por IA. Revisa los datos antes de usarlos."));
  }else if(d.kind==="detail"&&Array.isArray(d.steps)&&d.steps.length){
    m.append(h("h3","",d.title||"Plan de la idea"));
    const ol=h("ol");d.steps.forEach(s=>ol.append(h("li","",s)));m.append(ol);
    if(d.tip)m.append(h("p","","Un consejo: "+d.tip));
    const r=h("div","qr");
    r.append(btn("Dame más ideas como esta",()=>send("Dame 3 ideas nuevas parecidas a «"+(d.title||"esta")+"»")),saveBtn((d.title||"Plan")+": "+d.steps.join(" · ")));
    m.append(r,h("p","note","Generado por IA. Revisa los datos antes de usarlos."));
  }else throw 0;
  put(m);
}

/* Error con una sola acción (Hick) */
function showErr(text){
  const m=h("div","m bot err"),r=h("div","row");
  m.append(h("h3","","¡Ups! No pudimos generar tus ideas."),
    h("p","",text||"Se interrumpió la conexión, pero tu texto sigue guardado. Toca Reintentar."),r);
  r.append(btn("Reintentar",()=>{m.remove();call()}));
  put(m);
}

async function call(){
  busy=true;go.textContent="Pensando ideas…";sync();
  const t=h("div","m bot","Estoy preparando algunas ideas para ti…");put(t);
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({history})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw e.error||0}
    const d=await r.json();
    t.remove();render(d);
    history.push({role:"model",text:JSON.stringify(d)});
  }catch(c){
    t.remove();
    showErr(c==="busy"?"Gemini tiene mucha demanda en este momento. Tu texto sigue guardado: toca Reintentar en unos segundos.":undefined);
  }
  busy=false;go.textContent="Generar ideas";sync();
}

function send(text){
  if(busy||!text.trim())return;
  document.querySelectorAll(".qr").forEach(e=>e.remove());
  history.push({role:"user",text});
  put(h("div","m me",text));
  call();
}

q.addEventListener("input",sync);
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit()}});
$("f").addEventListener("submit",e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value="";sync();send(t)});
sync();
</script>
</body>
</html>
